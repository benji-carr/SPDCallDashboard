name: Daily SPD dashboard refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh SPD calls data
        run: |
          python refresh_data.py

      - name: Refresh SPD crime data
        run: |
          python refresh_crime_data.py

      - name: Remove generated geography lookup caches
        run: |
          rm -f data/processed/geography/event_mcpp_lookup.parquet
          rm -f data/processed/geography/crime_event_mcpp_lookup.parquet

      - name: Rebuild dashboard contexts
        run: |
          python -c "from spd_dashboard_data import load_dashboard_context; load_dashboard_context(); print('Calls context loaded')"
          python -c "from crime_dashboard_data import load_crime_dashboard_context; load_crime_dashboard_context(); print('Crime context loaded')"

      - name: Run smoke tests
        run: |
          python smoke_test_dashboard.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/processed/spd_calls.parquet
          git add data/processed/spd_calls_metadata.json

          git add data/processed/crime/crime_data.parquet
          git add data/processed/crime/crime_data_metadata.json

          git add data/processed/geography/event_mcpp_lookup.parquet
          git add data/processed/geography/crime_event_mcpp_lookup.parquet

          git status --short

          git diff --cached --quiet || git commit -m "Refresh dashboard data"

      - name: Push refreshed data
        run: |
          git push