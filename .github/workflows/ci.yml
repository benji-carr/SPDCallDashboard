name: Dashboard CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  freshness-tests:
    if: ${{ !startsWith(github.head_ref, 'automation/daily-data-refresh-') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run mocked dashboard freshness tests
        run: python -m pytest tests/dashboard/test_data_freshness.py -q